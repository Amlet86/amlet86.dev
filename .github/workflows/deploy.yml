name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.168.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Hugo
        run: |
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          hugo version

      - name: Build
        run: hugo --minify --gc

      # PDF-резюме печатается из главной (стили @media print в custom.css), поэтому в нём всегда
      # то же, что на сайте. Страницу отдаём локально, чтобы фото и стили брались из этой сборки
      - name: Resume PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core > /dev/null
          hugo --minify --baseURL http://127.0.0.1:8000/ -d /tmp/print
          python3 -m http.server 8000 -d /tmp/print > /dev/null 2>&1 &
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
            --virtual-time-budget=5000 --print-to-pdf=public/resume.pdf http://127.0.0.1:8000/
          test -s public/resume.pdf

      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # На сервере ключ ограничен rrsync: путь отсчитывается от /var/www/amlet86.dev
          rsync -rlz --delete --chmod=D755,F644 -e "ssh -i ~/.ssh/deploy_key" public/ deploy@185.200.86.14:./
